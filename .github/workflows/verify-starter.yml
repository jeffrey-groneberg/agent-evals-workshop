name: Verify starter

# Checks that the starter repository still behaves the way the site describes: lint, the free mock control
# eval, every catch-up state, the experiment plans and every quoted file. No model calls, no secrets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-starter.yml
      - docs/src/content/**
      - tools/**
  pull_request:
    paths:
      - .github/workflows/verify-starter.yml
      - docs/src/content/**
      - tools/**
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the starter against the site
    if: github.repository == 'jeffrey-groneberg/agent-evals-workshop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffrey-groneberg/agent-evals-workshop-starter
          path: starter
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install -g --no-audit --no-fund @microsoft/vally-cli@0.21.0
      - run: tools/verify-starter.sh starter
